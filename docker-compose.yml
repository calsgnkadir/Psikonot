services:
  psikonot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psikonot_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - VHV_DEMO_MODE=false
      - VHV_IP_ALLOWLIST_ENABLED=true
      - TRUST_PROXIES=true
      - TRUSTED_PROXIES=127.0.0.1,10.0.0.1
      - PORT=8000
      # Bind 0.0.0.0 INSIDE the container's network namespace so the published
      # port can reach the app. Host-level exposure is controlled by the `ports`
      # publish (and, in production, the private subnet + IP allowlist) — not by
      # binding loopback inside the container, which would make the published
      # port unreachable.
      - VHV_BIND_HOST=0.0.0.0
      # Keep state in volumes, not in the container layer or the code folders:
      # the SQL database and the device id go to /app/data, the encrypted chain
      # stores (records + attachments) to /app/backend/projects.
      - VHV_SQLITE_PATH=/app/data/vault.db
      - VHV_DEVICE_FINGERPRINT_FILE=/app/data/.device_fingerprint
      # The signing key is NOT stored here: production must supply
      # HEALTH_BLOCKCHAIN_KEY and PSEUDONYM_SECRET from a secret store (the app
      # refuses to boot without them). See docs/KEY_MANAGEMENT.md.
    volumes:
      # Mounted on a data folder, never on /app/database: that folder holds
      # Python modules, and a volume there would freeze them at the first build.
      - vhv_db_data:/app/data
      # Where the app actually writes the chain (database/storage.py PROJECTS_DIR).
      - vhv_lmdb_data:/app/backend/projects
    healthcheck:
      # Use Python (always present in the image) rather than curl, which is NOT
      # installed in python:3.11-slim — the curl-based probe reported a healthy
      # container as "unhealthy" simply because the binary was missing.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  vhv_db_data:
    driver: local
  vhv_lmdb_data:
    driver: local
