# ============================================================================
# PUBLIC DEMO / DEV PROFILE — SYNTHETIC DATA ONLY. NEVER for real records.
# ============================================================================
# Opt-in only (not auto-applied). Launch with:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up
#
# This profile deliberately relaxes the production posture so the vault can be
# shown publicly: demo mode seeds throwaway accounts (passwords are public in the
# README), the IP allowlist is off, and a signing key is auto-generated. The real
# system is private-VPC only (see docs/PRIVATE_VPC_DEPLOYMENT.md) and refuses to
# boot in production without a configured key/secret — do NOT use this file there.
services:
  psikonot:
    # Publish the demo on loopback only, so a throwaway build with public demo
    # credentials is not exposed to the local network. `!override` replaces the
    # base ports list instead of appending to it (which would double-publish the
    # container port and fail). Requires Docker Compose v2.24+.
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: development
      VHV_DEMO_MODE: "true"
      VHV_IP_ALLOWLIST_ENABLED: "false"
      VHV_ALLOW_GENERATED_KEY: "true"
      VHV_BIND_HOST: "0.0.0.0"
      # Demo only: keep the generated signing key in the data volume, so records
      # stay readable after the container is rebuilt. Never do this in
      # production — a key stored next to the data defeats encryption at rest.
      VHV_KEY_FILE: /app/data/.private_key
