name: PsikoNot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The README states Python 3.10+, so both supported versions are built.
        python-version: [ "3.10", "3.11" ]

    env:
      # The suite drives the API through Starlette's TestClient; TESTING relaxes
      # the CSRF double-submit check a real browser satisfies with a cookie.
      TESTING: "true"
      ENVIRONMENT: development
      VHV_DEMO_MODE: "true"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with Ruff
      run: ruff check . --select E,W,F --ignore E501,E402 --exclude backend/static

    - name: Security Scan with Bandit
      # Fails the build on medium and high findings. The low band is dominated by
      # try/except/pass and the demo seed credentials, which are deliberate;
      # failing on those would only teach people to ignore the scan.
      run: |
        bandit -r core/ backend/ database/ infrastructure/ \
          --skip B101,B311,B324 --severity-level medium --quiet

    - name: Run Test Suite
      run: python -m unittest discover -s tests -p "test_*.py" -v

    - name: Verify the Application Boots
      # A green suite with a broken import surface would still ship a dead server.
      run: python -c "from backend.main import app; print(f'{len(app.routes)} routes registered')"
